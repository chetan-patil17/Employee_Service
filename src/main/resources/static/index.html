<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard - EmpManager</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
<div class="app-container">

    <!-- Navigation Header -->
    <nav class="nav-header">
        <div class="nav-brand">
            <span class="nav-brand-icon">👨‍💼</span>
            <h1>Employee Service</h1>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">

        <!-- Add Employee Card -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">
                    <span class="card-title-icon">➕</span>
                    Add Employee
                </h2>
            </div>

            <div class="emp-form">
                <div class="form-group">
                    <input type="text" id="name" placeholder="👤 Employee Name">
                </div>

                <div class="form-group">
                    <input type="text" id="phone" placeholder="📞 Phone Number">
                </div>

                <div class="form-group">
                    <input type="email" id="email" placeholder="📧 Email Address">
                </div>

                <button class="btn btn-primary btn-full" onclick="addEmployee()">
                    ➕ Add Employee
                </button>
            </div>
        </div>

        <!-- Employee List Card -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">
                    <span class="card-title-icon">📋</span>
                    Employee Directory
                </h2>
            </div>

            <!-- Employee Table -->
            <div class="table-container">
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody id="employeeTable">
                        <!-- Data will be inserted dynamically -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
